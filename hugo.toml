baseURL = 'https://eleanora-lyh.github.io/MyLearningNotes/'
languageCode = 'zh-cn'
title = 'My Learning Notes'
theme = 'hugo-theme-stack'
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
timeZone = "Asia/Shanghai"
enableEmoji = true

[languages]
  [languages.zh-cn]
    languageCode = "zh-cn"
    languageName = "简体中文"
    title = "My Learning Notes"
    weight = 1
    contentDir = "content"

  [languages.en]
    languageCode = "en-us"
    languageName = "English"
    title = "My Learning Notes"
    weight = 2
    contentDir = "content"

# 日期配置：自动从文件系统获取日期
# enableGitInfo = true  # 设为 true 可从 Git 提交历史获取日期

[frontmatter]
  date = [":git", ":default", ":fileModTime"]  # date 优先使用 Git 首次提交
  lastmod = [":git", ":fileModTime", ":default"]  # lastmod 使用最后提交时间
  publishDate = [":default"]

[pagination]
  pagerSize = 10

[params]
  description = "个人学习笔记博客"
  author = "Eleanora"
  mainSections = ["posts"]
  rssFullContent = true
  # 分类徽标统一配色：文章卡片、侧边栏 Categories、/categories/ 页面都会读取这里。
  # 分类按文章数倒序取色：文章数最多的分类使用第一个颜色，颜色不够时循环取色。
  categoryColorPalette = ["#9b98f1", "#9ecad8", "#a7d2a1", "#e8a7b7", "#e7c58e", "#88c3c3", "#b8add9","#adbde1","#b0cfde","#b1ddb5","#e5c4ae","#db9694"]
  categoryColorText = "#ffffff"

  # Stack 主题使用 article.toc 控制文章内目录，使用 widgets.page 控制侧边栏目录。
  [params.article]
    toc = true
    readingTime = true
    headingAnchor = false
    math = false

    [params.article.list]
      showTags = true

  [params.dateFormat]
    published = "2006-01-02 15:04:05"
    lastUpdated = "2006-01-02 15:04:05"

  [params.footer]
    since = 2026
    customText = ""

  [params.sidebar]
    emoji = ""
    subtitle = "记录学习过程中的点滴"
    compact = false
    avatar = "img/whitebear_read_blue.png"

  # Stack 主题的组件配置。切换主题时只需要替换本节，不再依赖根目录 layouts 覆盖件。
  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "archives", params = { limit = 5 } },
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 20 } },
    ]
    page = [{ type = "toc" }]

  [params.colorScheme]
    toggle = true
    default = "auto"

  # Giscus 评论系统配置
  # 需要先在 GitHub 仓库启用 Discussions 功能
  # 访问 https://giscus.app/zh-CN 获取配置参数
  [params.comments]
    enabled = true  # 全局启用评论
    provider = "giscus"

    [params.comments.giscus]
      repo = "Eleanora-lyh/MyLearningNotes"
      repoID = "R_kgDOR3zQkg"  # 替换为你的 repo ID
      category = "Announcements"
      categoryID = "DIC_kwDOR3zQks4C57x0"  # 替换为你的 category ID
      mapping = "title"  # 使用文章标题而非 URL 路径，避免中文乱码
      lightTheme = "light"
      darkTheme = "dark_dimmed"
      lang = "zh-CN"
      reactionsEnabled = 1
      emitMetadata = 0
      inputPosition = "top"
      strict = 0
      loading = "lazy"

# Google Analytics 配置
# 请将下面的 G-XXXXXXXXXX 替换为你的 Google Analytics Measurement ID
# 获取地址: https://analytics.google.com/
[services.googleAnalytics]
  ID = "G-MV297YCMCZ"  # 例如: "G-XXXXXXXXXX"

# 菜单配置
[[menu.main]]
  name = "首页"
  url = "/"
  weight = 1
  [menu.main.params]
    icon = "home"

[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 2
  [menu.main.params]
    icon = "archives"

[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 3
  [menu.main.params]
    icon = "archives"

[[menu.main]]
  name = "分类"
  url = "/categories/"
  weight = 4
  [menu.main.params]
    icon = "categories"

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 5
  [menu.main.params]
    icon = "tag"

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 6
  [menu.main.params]
    icon = "user"

# 社交链接
[[menu.social]]
  identifier = "github"
  name = "GitHub: Eleanora-lyh"
  url = "https://github.com/Eleanora-lyh"
  [menu.social.params]
    icon = "brand-github"
    newTab = true

# 分类和标签
[taxonomies]
  category = "categories"
  tag = "tags"

# 输出格式：Stack 搜索页在 content/search.md 中单独生成 JSON 索引。
[outputs]
  home = ["HTML", "RSS"]

# Markdown 配置
[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    lineNumbersInTable = true
  
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # 允许渲染原始HTML，解决表格显示问题
  
  [markup.tableOfContents]
    startLevel = 1  # 从 H1 开始生成目录，保持与笔记大纲一致
    endLevel = 4    # 到 H4 结束
    ordered = false # 使用无序列表
